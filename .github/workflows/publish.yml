name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: [self-hosted, Linux, X64, vps]
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: true
        env:
          VP_GIT_HOOKS: '0'

      - name: Check (format, lint, types)
        run: vp check

      - name: Test
        run: vp run test:ci

      - name: Build
        run: vp pack

      - name: Verify package contents
        run: vp pm pack --json --pack-destination /tmp

      - name: Release
        run: vp exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
